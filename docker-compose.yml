name: rfqfollowup-19

services:
  db:
    image: postgres:16
    container_name: rfqfollowup-pg-19
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: .
    container_name: rfqfollowup-odoo-19
    depends_on:
      - db
    ports:
      - "13447:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./no_rfq_follow_up:/mnt/extra-addons/no_rfq_follow_up

volumes:
  db-data:
  odoo-data:
