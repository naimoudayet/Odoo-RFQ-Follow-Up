name: rfqfollowup-18

services:
  db:
    image: postgres:16
    container_name: rfqfollowup-pg-18
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: .
    container_name: rfqfollowup-odoo-18
    depends_on:
      - db
    ports:
      - "18447:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      PYTHONDONTWRITEBYTECODE: "1"   # else the bind mount fills the tree with __pycache__
    volumes:
      - odoo-data:/var/lib/odoo
      - ./no_rfq_follow_up:/mnt/extra-addons/no_rfq_follow_up

volumes:
  db-data:
  odoo-data:
